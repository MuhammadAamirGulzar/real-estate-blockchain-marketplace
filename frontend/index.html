<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo3.png" />
    <link rel="shortcut icon" href="/logo3.png" />
    <link rel="apple-touch-icon" href="/logo3.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050D1F" />
    <title>RWAChain - Real World Asset Tokenization Platform</title>

    <!-- Preconnect to Google Fonts servers for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inter + Playfair Display fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap"
    />

    <!-- Noscript fallback for font loading -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      />
    </noscript>

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Invest in Real Estate, Fraction by Fraction. Tokenize and trade real-world assets on the blockchain with RWAchain."
    />
    <meta
      name="keywords"
      content="real estate, tokenization, blockchain, investing, secondary markets"
    />
    <meta name="author" content="RWAchain Platform" />

    <!-- Open Graph / Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RWAChain - Real World Asset Tokenization Platform" />
    <meta
      property="og:description"
      content="Invest in Real Estate, Fraction by Fraction. Tokenize and trade real-world assets on the blockchain with RWAchain."
    />
    <meta property="og:image" content="/logo3.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RWAChain - Real World Asset Tokenization Platform" />
    <meta
      name="twitter:description"
      content="Invest in Real Estate, Fraction by Fraction. Tokenize and trade real-world assets on the blockchain with RWAchain."
    />
    <meta name="twitter:image" content="/logo3.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body class="antialiased bg-background text-foreground">
    <!-- Root element for React application -->
    <div id="root"></div>

    <!-- Main application entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
